version: 2

project_name: gomon

before:
  hooks:
    - go mod download
  
builds:
  - id: build
    env:
      - CGO_ENABLED=0
    flags:
      - -v
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
archives:
  - id: tar.gz
    format: tar.gz
  - id: binary
    format: binary
